<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customize — AFS Leather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script>(function(){try{if(localStorage.getItem('afs-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>

  <section class="studio page-overlay open" id="studio">
    <div class="page-overlay-bar" id="studioTopBar">
      <button class="page-back" id="closeCustomize">← Back</button>
      <span class="page-crumb">Customize</span>
      <button class="page-x" id="closeCustomizeX" title="Close" type="button">×</button>
    </div>
    <div class="studio-inner">
      <div class="studio-preview">
        <img id="previewImage" alt="Selected product preview">
        <span id="previewTint"></span>
        <div class="preview-label">AFS<br><small>Made in studio</small></div>
      </div>
      <div class="studio-controls" id="previewBody">
        <p class="eyebrow">02 / Studio</p>
        <h2>Make it yours.</h2>
        <p>Choose a product, then use a replacement image or color code added by the studio.</p>
        <div class="current-piece">
          <span>Current piece</span>
          <strong id="selectedName"></strong>
          <b id="selectedPrice"></b>
        </div>
        <div id="optionGroups"></div>
        <button class="button gold full" id="addToCart">Add to cart <span id="addPrice"></span> +</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="preview.js"></script>
</body>
</html>
